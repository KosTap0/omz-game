function viewForge(){return`<button class="back-btn" data-action="back-games">‹ Назад</button><div class="card"><div class="card-title"><span class="dot"></span>Кузнец</div><p style="font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:14px;text-align:center">Максимум ударов за 10 секунд!</p><div class="game-info" style="margin-bottom:6px"><span>Время: <b id="forgeTimer" style="color:var(--accent2)">10.0 с</b></span><span>Удары: <b id="forgeClicks" style="color:var(--ok)">0</b></span></div><div class="big-stat" id="forgeScore">0</div><div style="text-align:center;font-size:11px;color:var(--muted);margin-bottom:14px;letter-spacing:1px">ОЧКОВ</div><button class="forge-btn" id="forgeBtn" disabled>🔨 БЕЙ!</button><div class="game-result" id="forgeResult" style="text-align:center;min-height:22px;margin-top:14px"></div><button class="btn" id="forgeStart" style="margin-top:10px">Старт</button></div>`}
function setupForge(){const btn=document.getElementById('forgeBtn'),startBtn=document.getElementById('forgeStart'),timerEl=document.getElementById('forgeTimer');const clicksEl=document.getElementById('forgeClicks'),scoreEl=document.getElementById('forgeScore'),resultEl=document.getElementById('forgeResult');let clicks=0,timeLeft=10,running=false,timerId=null,done=false;btn.onclick=()=>{if(!running)return;clicks++;clicksEl.textContent=clicks;scoreEl.textContent=Math.floor(clicks*5/10)};startBtn.onclick=()=>{if(running)return;clicks=0;timeLeft=10;running=true;done=false;clicksEl.textContent='0';scoreEl.textContent='0';timerEl.textContent='10.0 с';resultEl.textContent='';startBtn.disabled=true;btn.disabled=false;timerId=setInterval(()=>{timeLeft-=.1;timerEl.textContent=Math.max(0,timeLeft).toFixed(1)+' с';if(timeLeft<=0)finish()},100)};function finish(){if(done)return;done=true;clearInterval(timerId);timerId=null;running=false;btn.disabled=true;startBtn.disabled=false;startBtn.textContent='Снова';const base=clicks*5;let bonus=0;if(clicks>=20)bonus+=30;if(clicks>=40)bonus+=60;if(clicks>=60)bonus+=100;if(clicks>=80)bonus+=150;const total=Math.floor((base+bonus)/10);scoreEl.textContent=total;resultEl.innerHTML=`Удары: <b>${clicks}</b> • Очки: <b style="color:var(--accent2)">${total}</b>`;registerGamePlayed(total)}gameCleanup=()=>{clearInterval(timerId);timerId=null}}

/* ВИНТИКИ */
const SCREW_COLORS=['#ef5350','#42a5f5','#66bb6a','#fdd835','#ab47bc','#ff9800','#26c6da','#ec407a','#8d6e63'];
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}

function screwsConfig(level){const n=Math.max(1,Math.min(500,level));let boards,colors,slotsPerBoard=4;if(n<=2){boards=2;colors=2}else if(n<=5){boards=3;colors=2}else if(n<=10){boards=3;colors=3}else if(n<=18){boards=4;colors=3}else if(n<=30){boards=4;colors=4}else if(n<=45){boards=5;colors=4}else if(n<=65){boards=5;colors=5}else if(n<=90){boards=6;colors=5}else if(n<=120){boards=6;colors=6}else if(n<=160){boards=7;colors=6}else if(n<=210){boards=7;colors=7}else if(n<=270){boards=8;colors=7}else if(n<=340){boards=8;colors=8}else if(n<=420){boards=9;colors=8}else{boards=9;colors=9}return{boards,colors,slotsPerBoard}}
function screwsDifficulty(level){const n=Math.max(1,Math.min(500,level));if(n<=10)return{label:'ЛЕГКО',cls:'easy'};if(n<=60)return{label:'СРЕДНЕ',cls:'medium'};if(n<=200)return{label:'СЛОЖНО',cls:'hard'};return{label:'ХАРДКОР',cls:'insane'}}

function generateScrewsLevel(level){const cfg=screwsConfig(level);const rng=mulberry32(level*104729+7);const totalScrews=cfg.colors*3;const bag=[];for(let c=0;c<cfg.colors;c++)bag.push(c,c,c);for(let i=bag.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}const boards=[];for(let b=0;b<cfg.boards;b++)boards.push({id:b,slots:new Array(cfg.slotsPerBoard).fill(null),fallen:false,falling:false});const screwsPerBoard=[];let remaining=totalScrews;for(let b=0;b<cfg.boards;b++){const target=Math.min(cfg.slotsPerBoard-1,Math.ceil(remaining/(cfg.boards-b)));screwsPerBoard.push(target);remaining-=target}if(remaining>0){for(let b=0;b<cfg.boards&&remaining>0;b++){if(screwsPerBoard[b]<cfg.slotsPerBoard){screwsPerBoard[b]++;remaining--}}}for(let b=0;b<cfg.boards;b++){const count=screwsPerBoard[b];const picked=[];const colorCount={};for(let k=0;k<count;k++){let bestIdx=0,bestCount=Infinity;for(let i=0;i<bag.length;i++){const c=colorCount[bag[i]]||0;if(c<bestCount){bestCount=c;bestIdx=i;if(c===0)break}}const color=bag[bestIdx];bag.splice(bestIdx,1);picked.push(color);colorCount[color]=(colorCount[color]||0)+1}for(let k=0;k<picked.length;k++)boards[b].slots[k]={color:picked[k]};for(let i=cfg.slotsPerBoard-1;i>0;i--){const j=Math.floor(rng()*(i+1));[boards[b].slots[i],boards[b].slots[j]]=[boards[b].slots[j],boards[b].slots[i]]}}return{boards,slotsPerBoard:cfg.slotsPerBoard}}

let screwsState=null;
function viewScrews(){const lvl=S.screws.unlocked;if(!screwsState||screwsState.level!==lvl)initScrewsLevel(lvl);return renderScrewsBoard()}
function initScrewsLevel(level){const d=generateScrewsLevel(level);screwsState={level,boards:d.boards,slotsPerBoard:d.slotsPerBoard,selected:null,busy:false,won:false,lost:false,moves:0}}
function hasUpperWithScrews(idx){for(let j=0;j<idx;j++){const up=screwsState.boards[j];if(!up.fallen&&!up.falling&&up.slots.some(x=>x))return true}return false}
function isBoardFull(b){return!b.fallen&&!b.falling&&b.slots.every(x=>x)}
function getBoardState(idx){const b=screwsState.boards[idx];if(!b||b.fallen||b.falling)return'free';if(!hasUpperWithScrews(idx))return'free';if(isBoardFull(b))return'full-unlocked';return'locked'}
function canReadBoard(idx){const st=getBoardState(idx);return st==='free'||st==='full-unlocked'}

function renderScrewsBoard(){const s=screwsState;if(!s)return'';const activeBoards=s.boards.filter(b=>!b.fallen);const totalScrewsLeft=activeBoards.reduce((sum,b)=>sum+b.slots.filter(x=>x).length,0);const boardCount=s.boards.length;const sizeCls=boardCount>=8?'tiny':(boardCount>=6?'compact':'');let stackHtml='';s.boards.forEach((b,bi)=>{if(b.fallen)return;const isEmpty=b.slots.every(x=>!x);const state=getBoardState(bi);let cls='sw-board ';if(isEmpty)cls+='empty ';if(b.falling)cls+='falling ';if(state==='locked')cls+='locked ';else if(state==='full-unlocked')cls+='full-unlocked ';else if(!isEmpty)cls+='active ';cls+=sizeCls;const readable=(state!=='locked');let holesHtml=b.slots.map((sc,si)=>{if(!sc){const canDrop=s.selected&&s.selected.boardIdx!==bi;return`<div class="sw-hole empty ${canDrop?'can-drop':''}" data-board="${bi}" data-slot="${si}" data-empty="1"></div>`}const color=SCREW_COLORS[sc.color];const isSel=s.selected&&s.selected.boardIdx===bi&&s.selected.slotIdx===si;const merging=sc.merging?'merging':'';const clickCls=readable?'clickable':'not-clickable';return`<div class="sw-hole filled ${isSel?'selected':''} ${clickCls} ${merging}" data-board="${bi}" data-slot="${si}" data-filled="1"><div class="screw" style="background:${color}"></div></div>`}).join('');stackHtml+=`<div class="${cls}" data-board-outer="${bi}">${holesHtml}</div>`});if(!stackHtml)stackHtml='<div style="text-align:center;padding:40px;color:var(--muted);font-size:13px">Все доски упали</div>';const diff=screwsDifficulty(s.level);let overlay='';if(s.won){overlay=`<div class="sw-overlay win"><div class="sw-card"><div class="sw-ic">🏆</div><h3>Уровень ${s.level} пройден!</h3><p>Ходов: <b style="color:var(--accent2)">${s.moves}</b></p>${s.level<500?`<button class="btn" data-action="screw-next">Следующий ›</button>`:`<div style="color:var(--accent2);font-weight:800;margin-bottom:12px">🎉 Все 500!</div>`}<button class="btn ghost" data-action="screw-retry" style="margin-top:8px">Заново</button></div></div>`}else if(s.lost){overlay=`<div class="sw-overlay lose"><div class="sw-card"><div class="sw-ic">💥</div><h3>Тупик!</h3><p>Нет свободных гнёзд и нечего собирать.</p><button class="btn danger" data-action="screw-retry">↻ Переиграть</button><button class="btn ghost" data-action="screw-reshuffle" style="margin-top:8px">🔀 Перемешать</button></div></div>`}const navBar=`<div class="sw-nav">${s.level>1?`<button class="btn ghost" data-action="screw-prev">‹ Ур. ${s.level-1}</button>`:''}${s.level<500&&s.level<S.screws.unlocked?`<button class="btn ghost" data-action="screw-next">Ур. ${s.level+1} ›</button>`:''}</div>`;let hint='';if(s.selected){hint=`<div class="sw-hint" style="color:var(--accent2);font-weight:700;border-color:rgba(255,179,71,.4);background:rgba(255,179,71,.08)">🔩 Винтик выбран — тапни пустое гнездо</div>`}else{hint=`<div class="sw-hint">👉 Тапни винтик, затем пустое гнездо. 🔒 = под замком, 🔓 = открыта</div>`}return`<button class="back-btn" data-action="back-games">‹ Назад</button><div class="card" style="position:relative">${overlay}<div class="sw-header"><div class="sw-stat">Уровень<b>${s.level} / 500</b></div><div class="sw-stat">Досок<b>${s.boards.filter(b=>!b.fallen).length} / ${s.boards.length}</b></div><div class="sw-stat">Винтиков<b>${totalScrewsLeft}</b></div></div><div style="display:flex;justify-content:center;margin-bottom:10px"><span class="sw-badge ${diff.cls}">${diff.label}</span></div>${navBar}<div class="sw-rules"><b>🎯</b> Собери <b>3 одного цвета</b> на одной доске — они затянутся.<br><b>🔒</b> Нижние доски под замком. <b>Забирать нельзя, вкручивать — можно</b>.<br><b>🔓</b> Полностью заполненная доска <b>открывается</b> — можно взять любой винтик.<br><b>⚡</b> Снимешь винтик — доска снова под замком.<br><b>📌</b> Пустая доска падает, когда все доски под ней упали.</div><div class="sw-stage"><div class="sw-stack">${stackHtml}</div><div class="sw-ground"></div></div>${hint}<div class="sw-actions"><button class="btn ghost" data-action="screw-retry">↻ Заново</button><button class="btn ghost" data-action="screw-reshuffle">🔀 Перемешать</button></div><div style="font-size:11px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.5">Пройдено: <b style="color:var(--accent2)">${S.screws.completed}</b> из 500</div></div>`}

function setupScrews(){const container=document.getElementById('view');if(!container)return;container.querySelectorAll('.sw-hole').forEach(hole=>{hole.addEventListener('click',()=>tapHole(hole))});gameCleanup=()=>{}}
function tapHole(hole){const s=screwsState;if(!s||s.busy||s.won||s.lost)return;const bi=Number(hole.dataset.board),si=Number(hole.dataset.slot);const board=s.boards[bi];if(!board||board.fallen||board.falling)return;const isFilled=hole.dataset.filled==='1';if(isFilled){if(!canReadBoard(bi))return;if(s.selected){if(s.selected.boardIdx===bi&&s.selected.slotIdx===si){s.selected=null;refreshScrewsBoard();return}s.selected={boardIdx:bi,slotIdx:si};refreshScrewsBoard();return}s.selected={boardIdx:bi,slotIdx:si};refreshScrewsBoard();return}if(!s.selected)return;if(s.selected.boardIdx===bi)return;moveScrew(s.selected.boardIdx,s.selected.slotIdx,bi,si)}
function moveScrew(fromBi,fromSi,toBi,toSi){const s=screwsState;if(s.busy)return;const fromBoard=s.boards[fromBi],toBoard=s.boards[toBi];if(!fromBoard||fromBoard.fallen||fromBoard.falling)return;if(!toBoard||toBoard.fallen||toBoard.falling)return;const fromScrew=fromBoard.slots[fromSi],toScrew=toBoard.slots[toSi];if(!fromScrew)return;s.busy=true;s.moves++;s.selected=null;if(toScrew){fromBoard.slots[fromSi]=toScrew;toBoard.slots[toSi]=fromScrew}else{fromBoard.slots[fromSi]=null;toBoard.slots[toSi]=fromScrew}refreshScrewsBoard();setTimeout(()=>{const anyMerge=checkAndMarkMerges();if(anyMerge){refreshScrewsBoard();setTimeout(()=>applyMerges(),600)}else{s.busy=false;setTimeout(()=>checkFalls(),100)}},250)}
function checkAndMarkMerges(){const s=screwsState;let any=false;for(const b of s.boards){if(b.fallen||b.falling)continue;const byColor={};b.slots.forEach((sc,i)=>{if(sc&&!sc.merging){if(!byColor[sc.color])byColor[sc.color]=[];byColor[sc.color].push(i)}});for(const c in byColor){if(byColor[c].length>=3){byColor[c].slice(0,3).forEach(i=>{b.slots[i].merging=true});any=true}}}return any}
function applyMerges(){const s=screwsState;for(const b of s.boards){if(b.fallen||b.falling)continue;b.slots.forEach((sc,i)=>{if(sc&&sc.merging)b.slots[i]=null})}refreshScrewsBoard();setTimeout(()=>{s.busy=false;checkFalls()},200)}
function checkFalls(){const s=screwsState;if(!s)return;for(let i=s.boards.length-1;i>=0;i--){const b=s.boards[i];if(b.fallen||b.falling)continue;const isEmpty=b.slots.every(x=>!x);if(!isEmpty)continue;let allBelowFallen=true;for(let j=i+1;j<s.boards.length;j++){if(!s.boards[j].fallen){allBelowFallen=false;break}}if(!allBelowFallen)continue;b.falling=true;refreshScrewsBoard();setTimeout(()=>{b.falling=false;b.fallen=true;refreshScrewsBoard();setTimeout(()=>{checkFalls();checkWin()},100)},650);return}setTimeout(()=>checkStuck(),150)}
function checkStuck(){const s=screwsState;if(s.won||s.lost||s.busy)return;const active=s.boards.filter(b=>!b.fallen&&!b.falling);if(active.length===0)return;let hasEmpty=false;for(const b of active){if(b.slots.some(x=>!x)){hasEmpty=true;break}}if(hasEmpty)return;s.lost=true;refreshScrewsBoard()}
function checkWin(){const s=screwsState;if(s.won||s.lost)return;const active=s.boards.filter(b=>!b.fallen);if(active.length===0){s.won=true;const reward=5+Math.floor(s.level/25);S.screws.completed=Math.max(S.screws.completed,s.level);if(s.level>=S.screws.unlocked&&S.screws.unlocked<500)S.screws.unlocked=s.level+1;save();registerPuzzlePlayed(reward);refreshScrewsBoard()}}
function refreshScrewsBoard(){if(!screwsState)return;const c=document.getElementById('view');if(!c)return;c.innerHTML=renderScrewsBoard();setupScrews()}
function reshuffleScrews(){const s=screwsState;if(!s)return;const newData=generateScrewsLevel(s.level);s.boards=newData.boards;s.slotsPerBoard=newData.slotsPerBoard;s.selected=null;s.busy=false;s.won=false;s.lost=false;s.moves=0;refreshScrewsBoard()}

/* МАДЖОНГ */
const MJ_SYMBOLS=['🔥','⚙️','🔨','🏭','🔩','🛠️','⚗️','📐','📊','🔬','🏗️','💼','🎖️','🎩'];

function mjConfig(level){const n=Math.max(1,Math.min(500,level));let rows,cols,types,seconds;if(n<=10){rows=4;cols=4;types=4;seconds=120}else if(n<=25){rows=5;cols=4;types=5;seconds=130}else if(n<=50){rows=5;cols=5;types=6;seconds=150}else if(n<=80){rows=6;cols=5;types=7;seconds=170}else if(n<=130){rows=6;cols=6;types=8;seconds=200}else if(n<=200){rows=7;cols=6;types=9;seconds=230}else if(n<=300){rows=7;cols=7;types=10;seconds=270}else if(n<=400){rows=8;cols=7;types=12;seconds=310}else{rows=8;cols=8;types=14;seconds=360}return{rows,cols,types,seconds}}
function mjDifficulty(level){const n=Math.max(1,Math.min(500,level));if(n<=50)return{label:'ЛЕГКО',cls:'easy'};if(n<=150)return{label:'СРЕДНЕ',cls:'medium'};if(n<=300)return{label:'СЛОЖНО',cls:'hard'};return{label:'ХАРДКОР',cls:'insane'}}

function mjGeneratePositions(cfg){const positions=[];for(let r=0;r<cfg.rows;r++)for(let c=0;c<cfg.cols;c++)positions.push({layer:0,r,c});if(cfg.rows-2>=2&&cfg.cols-2>=2){for(let r=0;r<cfg.rows-2;r++)for(let c=0;c<cfg.cols-2;c++)positions.push({layer:1,r:r+1,c:c+1})}if(cfg.rows-4>=2&&cfg.cols-4>=2){for(let r=0;r<cfg.rows-4;r++)for(let c=0;c<cfg.cols-4;c++)positions.push({layer:2,r:r+2,c:c+2})}return positions}

function mjGenerateLevel(level){const cfg=mjConfig(level);const rng=mulberry32(level*5381+31);let positions=mjGeneratePositions(cfg);if(positions.length%2!==0){let maxLayer=0;positions.forEach(p=>{if(p.layer>maxLayer)maxLayer=p.layer});const topIdx=positions.map((p,i)=>({i,layer:p.layer})).filter(x=>x.layer===maxLayer).map(x=>x.i);if(topIdx.length>0){positions.splice(topIdx[topIdx.length-1],1)}else{positions.pop()}}for(let i=positions.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[positions[i],positions[j]]=[positions[j],positions[i]]}const pairs=positions.length/2;const symbols=[];for(let i=0;i<pairs;i++){const sym=MJ_SYMBOLS[Math.floor(rng()*cfg.types)];symbols.push(sym);symbols.push(sym)}for(let i=symbols.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[symbols[i],symbols[j]]=[symbols[j],symbols[i]]}const tiles=[];for(let i=0;i<positions.length;i++){tiles.push({id:i,layer:positions[i].layer,r:positions[i].r,c:positions[i].c,sym:symbols[i],flipped:false,matched:false,locked:false})}return{tiles,cfg,rows:cfg.rows,cols:cfg.cols,seconds:cfg.seconds,types:cfg.types}}

let mjState=null;
function viewMahjong(){const unlocked=S.mahjong?S.mahjong.unlocked:1;if(!mjState||mjState.level!==unlocked)initMjLevel(unlocked);return renderMjBoard()}
function initMjLevel(level){const d=mjGenerateLevel(level);mjState={level,tiles:d.tiles,cfg:d.cfg,rows:d.rows,cols:d.cols,seconds:d.seconds,timeLeft:d.seconds,selectedId:null,busy:false,won:false,lost:false,moves:0,timerId:null,started:false,tileW:0,tileH:0};mjUpdateLocks()}

function mjOverlaps(a,b){if(a.layer<=b.layer)return false;const ax=a.c*2+a.layer;const ay=a.r*2+a.layer;const bx=b.c*2+b.layer;const by=b.r*2+b.layer;return ax<bx+2&&ax+2>bx&&ay<by+2&&ay+2>by}

function mjUpdateLocks(){const s=mjState;if(!s)return;const alive=s.tiles.filter(t=>!t.matched);alive.forEach(b=>{b.locked=false;for(const a of alive){if(a.id===b.id)continue;if(a.layer<=b.layer)continue;if(mjOverlaps(a,b)){b.locked=true;break}}})}

function mjComputeLayout(){const s=mjState;if(!s)return;const panel=document.querySelector('.mj-panel');const availableW=panel?panel.clientWidth-20:Math.min(800,window.innerWidth-60);const availableH=Math.min(window.innerHeight*0.55,520);const maxCols=s.cols+2;const maxRows=s.rows+2;const tileW=Math.floor(Math.min(availableW/(maxCols+0.5),availableH/(maxRows*1.32+0.5)));const finalW=Math.max(28,Math.min(64,tileW));const finalH=Math.floor(finalW*1.32);s.tileW=finalW;s.tileH=finalH}

function renderMjBoard(){const s=mjState;if(!s)return'';mjUpdateLocks();mjComputeLayout();const left=s.tiles.filter(t=>!t.matched).length;const diff=mjDifficulty(s.level);const timePct=s.seconds>0?Math.max(0,(s.timeLeft/s.seconds)*100):0;const warn=s.timeLeft<=15&&s.started&&!s.won&&!s.lost;const sorted=s.tiles.slice().sort((a,b)=>{if(a.layer!==b.layer)return a.layer-b.layer;return a.id-b.id});let tilesHtml='';sorted.forEach(t=>{if(t.matched)return;const offset=t.layer*(s.tileW/2);const x=t.c*s.tileW+offset;const y=t.r*s.tileH+offset;const z=10+t.layer*10+t.id%3;const cls='mj-tile'+(t.locked?' locked':'')+(t.flipped?' flipped':'')+(s.selectedId===t.id?' selected':'');tilesHtml+=`<div class="${cls}" data-tile-id="${t.id}" style="left:${x}px;top:${y}px;width:${s.tileW}px;height:${s.tileH}px;z-index:${z};--tile-font:${Math.floor(s.tileW*0.62)}px"><div class="mj-tile-inner"><div class="mj-tile-face mj-tile-back"></div><div class="mj-tile-face mj-tile-front">${t.sym}</div></div></div>`});const frameW=s.cols*s.tileW+2*(s.tileW/2)+s.tileW/2;const frameH=s.rows*s.tileH+2*(s.tileH/2)+s.tileH/2;let overlay='';if(s.won){overlay=`<div class="sw-overlay win"><div class="sw-card"><div class="sw-ic">🀄</div><h3>Уровень ${s.level} пройден!</h3><p>Ходов: <b style="color:var(--accent2)">${s.moves}</b> • Осталось: <b style="color:var(--accent2)">${Math.floor(s.timeLeft)}с</b></p>${s.level<500?`<button class="btn" data-action="mj-next">Следующий ›</button>`:`<div style="color:var(--accent2);font-weight:800;margin-bottom:12px">🎉 Все 500!</div>`}<button class="btn ghost" data-action="mj-retry" style="margin-top:8px">Заново</button></div></div>`}else if(s.lost){overlay=`<div class="sw-overlay lose"><div class="sw-card"><div class="sw-ic">⏰</div><h3>Время вышло!</h3><p>Осталось плиток: <b>${left}</b></p><button class="btn danger" data-action="mj-retry">↻ Попробовать снова</button></div></div>`}return`<button class="back-btn" data-action="back-games">‹ Назад</button><div class="card" style="position:relative;padding:14px">${overlay}<div class="mj-bar"><div class="mj-stat">Уровень<b>${s.level}/500</b></div><div class="mj-stat">Плиток<b>${left}</b></div><div class="mj-stat">Ходов<b>${s.moves}</b></div></div><div style="display:flex;justify-content:center;gap:8px;margin-bottom:10px;flex-wrap:wrap"><span class="sw-badge ${diff.cls}">${diff.label}</span><span class="sw-badge ${warn?'insane':'easy'}">⏱ ${Math.floor(s.timeLeft)}с</span></div><div class="mj-timer ${warn?'warn':''}"><i style="width:${timePct}%"></i></div><div class="mj-panel"><div class="mj-frame" style="width:${frameW}px;height:${frameH}px;margin:0 auto;">${tilesHtml}</div></div><div style="font-size:11.5px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.55">🎴 Плитки закрыты — тапни, чтобы перевернуть.<br>🔒 Затемнённые накрыты сверху — открыть нельзя.<br>🎯 Совпавшие пары исчезают. Убери всё до конца таймера!<br>Пройдено: <b style="color:var(--accent2)">${S.mahjong?S.mahjong.completed:0}</b> из 500</div><div class="sw-actions"><button class="btn ghost" data-action="mj-retry">↻ Заново</button><button class="btn ghost" data-action="mj-shuffle">🔀 Перемешать</button></div><div class="sw-nav" style="margin-top:10px">${s.level>1?`<button class="btn ghost" data-action="mj-prev">‹ Ур. ${s.level-1}</button>`:''}${s.level<500&&s.level<(S.mahjong?S.mahjong.unlocked:1)?`<button class="btn ghost" data-action="mj-next">Ур. ${s.level+1} ›</button>`:''}</div></div>`}

function setupMahjong(){const container=document.getElementById('view');if(!container||!mjState)return;container.querySelectorAll('.mj-tile').forEach(el=>{el.addEventListener('click',()=>tapMjTile(el))});if(!mjState.started&&!mjState.won&&!mjState.lost){mjState.started=true;startMjTimer()}gameCleanup=()=>{if(mjState&&mjState.timerId){clearInterval(mjState.timerId);mjState.timerId=null}}}

function startMjTimer(){const s=mjState;if(!s||s.timerId)return;s.timerId=setInterval(()=>{if(!mjState||mjState.won||mjState.lost){if(s.timerId){clearInterval(s.timerId);s.timerId=null}return}s.timeLeft-=0.5;if(s.timeLeft<=0){s.timeLeft=0;s.lost=true;if(s.timerId){clearInterval(s.timerId);s.timerId=null}refreshMjBoard();return}const t=document.querySelector('.mj-timer');const s2=mjState;if(t){t.querySelector('i').style.width=Math.max(0,(s2.timeLeft/s2.seconds)*100)+'%';t.classList.toggle('warn',s2.timeLeft<=15)}document.querySelectorAll('.sw-badge').forEach(b=>{if(b.textContent.includes('⏱'))b.textContent='⏱ '+Math.floor(s2.timeLeft)+'с'})},500)}

function tapMjTile(el){const s=mjState;if(!s||s.busy||s.won||s.lost)return;const id=Number(el.dataset.tileId);const t=s.tiles.find(x=>x.id===id);if(!t||t.matched)return;if(t.locked){el.classList.add('shaking');setTimeout(()=>el.classList.remove('shaking'),400);toast('🔒 Сверху лежат другие плитки','');return}if(t.flipped){if(s.selectedId===id)return;t.flipped=false;refreshMjBoard();return}if(s.selectedId!==null){const first=s.tiles.find(x=>x.id===s.selectedId);if(!first){s.selectedId=null;return}t.flipped=true;s.moves++;s.busy=true;refreshMjBoard();setTimeout(()=>{if(first.sym===t.sym){first.matched=true;t.matched=true;s.selectedId=null;s.busy=false;const left=s.tiles.filter(x=>!x.matched).length;if(left===0){s.won=true;if(s.timerId){clearInterval(s.timerId);s.timerId=null}const reward=10+Math.floor(s.level/15);if(!S.mahjong)S.mahjong={unlocked:1,completed:0};S.mahjong.completed=Math.max(S.mahjong.completed,s.level);if(s.level>=S.mahjong.unlocked&&S.mahjong.unlocked<500)S.mahjong.unlocked=s.level+1;save();registerGamePlayed(reward)}refreshMjBoard()}else{setTimeout(()=>{first.flipped=false;t.flipped=false;s.selectedId=null;s.busy=false;refreshMjBoard()},700)}},300)}else{t.flipped=true;s.selectedId=id;refreshMjBoard()}}

function refreshMjBoard(){if(!mjState)return;const c=document.getElementById('view');if(!c)return;c.innerHTML=renderMjBoard();setupMahjong()}

function shuffleMj(){const s=mjState;if(!s||s.won)return;const alive=s.tiles.filter(t=>!t.matched);const syms=alive.map(t=>t.sym);for(let i=syms.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[syms[i],syms[j]]=[syms[j],syms[i]]}alive.forEach((t,i)=>{t.sym=syms[i];t.flipped=false});s.selectedId=null;refreshMjBoard()}

function setupGame(){if(currentGameId==='smelt')setupSmelt();else if(currentGameId==='sort')setupSort();else if(currentGameId==='memory')setupMemory();else if(currentGameId==='forge')setupForge();else if(currentGameId==='screws')setupScrews();else if(currentGameId==='mahjong')setupMahjong()}

const modal=document.getElementById('modal');
function closeModal(){modal.classList.remove('on');modal.innerHTML=''}
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});

function openEvent(id){const ev=EVENTS.find(x=>x.id===id);if(!ev||S.events.includes(id))return;modal.innerHTML=`<div class="modal-box"><h2>${ev.title}</h2><p>${ev.place} • ${ev.date}<br><br>Награда: <b style="color:var(--accent2)">+${fmt(ev.points)} очков</b><br><br><b>Вариант 1:</b> фотоотчёт — проверит администратор.<br><b>Вариант 2:</b> ответ на вопрос по локации — засчитается сразу.</p><button class="opt" data-action="ev-photo" data-id="${id}">📸 Загрузить фотоотчёт</button><button class="opt" data-action="ev-quiz" data-id="${id}">❓ Ответить на вопрос</button><button class="btn ghost" data-action="close">Отмена</button></div>`;modal.classList.add('on')}

function openEventPhoto(id){const ev=EVENTS.find(x=>x.id===id);modal.innerHTML=`<div class="modal-box"><h2>Фотоотчёт</h2><p>Сделай фото на мероприятии «${ev.title}». Администратор проверит и начислит ${fmt(ev.points)} очков.</p><label class="upload-zone" for="photoInput"><span class="u-ic">📷</span>Выбрать фото</label><input type="file" id="photoInput" accept="image/*" style="display:none"><div id="photoArea"></div><button class="btn" id="confirmPhoto" disabled>Отправить</button><button class="btn ghost" data-action="close">Отмена</button></div>`;modal.classList.add('on');const input=document.getElementById('photoInput'),area=document.getElementById('photoArea'),confirm=document.getElementById('confirmPhoto');input.addEventListener('change',()=>{const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{area.innerHTML=`<img class="photo-prev" src="${e.target.result}">`;confirm.disabled=false;confirm.onclick=()=>submitPhoto(id,e.target.result)};r.readAsDataURL(f)})}

function submitPhoto(eventId,imageData){const ev=EVENTS.find(x=>x.id===eventId);const srv=serverLoad();const id=serverNextId(srv);srv.pendingEvents.push({id,playerName:S.name,eventId,eventTitle:ev.title,eventPoints:ev.points,image:imageData,date:Date.now(),status:'pending',adminNote:''});serverSave(srv);closeModal();toast('📸 Фото отправлено на проверку','gold');if(activeTab==='events')render()}

function openEventQuiz(id){const ev=EVENTS.find(x=>x.id===id);modal.innerHTML=`<div class="modal-box"><h2>Вопрос по локации</h2><p>Ответь правильно — участие подтвердится сразу (+${fmt(ev.points)}).</p><div style="font-size:14.5px;font-weight:600;line-height:1.5;margin-bottom:16px">${ev.q.q}</div>${ev.q.a.map((a,i)=>`<button class="opt" data-action="ev-answer" data-id="${id}" data-i="${i}">${a}</button>`).join('')}<button class="btn ghost" data-action="close">Отмена</button></div>`;modal.classList.add('on')}

function answerEvent(id,i){const ev=EVENTS.find(x=>x.id===id);const btns=modal.querySelectorAll('[data-action="ev-answer"]');btns.forEach((b,idx)=>{b.disabled=true;if(idx===ev.q.c)b.classList.add('correct');else if(idx===i)b.classList.add('wrong')});if(i===ev.q.c){setTimeout(()=>completeEvent(id,'quiz'),700)}else{setTimeout(()=>{modal.querySelector('.modal-box').insertAdjacentHTML('beforeend',`<div style="text-align:center;font-size:13px;color:var(--hot);font-weight:700;margin-top:12px">Неверно.</div>`)},400)}}

function completeEvent(id,method){if(S.events.includes(id))return;const ev=EVENTS.find(x=>x.id===id);S.events.push(id);save();closeModal();addPoints(ev.points,ev.title);toast(`🎭 Участие подтверждено! +${fmt(ev.points)}`,'gold');if(activeTab==='events'||activeTab==='home')render()}

function approvePhoto(id){const srv=serverLoad();const pe=srv.pendingEvents.find(p=>p.id===id);if(!pe||pe.status!=='pending')return;pe.status='approved';pe.adminRead=true;if(srv.players[pe.playerName])srv.players[pe.playerName].points+=pe.eventPoints;serverSave(srv);toast(`✓ Фото одобрено. Начислено ${fmt(pe.eventPoints)}`,'ok');if(pe.playerName===S.name){S.points+=pe.eventPoints;if(!S.events.includes(pe.eventId))S.events.push(pe.eventId);save()}render()}

function rejectPhoto(id){modal.innerHTML=`<div class="modal-box"><h2>Отклонить фото</h2><p>Укажите причину.</p><textarea class="field" id="rejectNote" placeholder="Причина…" maxlength="200"></textarea><button class="btn danger" data-action="confirm-reject" data-id="${id}">Отклонить</button><button class="btn ghost" data-action="close">Отмена</button></div>`;modal.classList.add('on')}

function confirmReject(id){const note=document.getElementById('rejectNote').value.trim()||'Фото не подтверждает участие';const srv=serverLoad();const pe=srv.pendingEvents.find(p=>p.id===id);if(!pe)return;pe.status='rejected';pe.adminNote=note;pe.adminRead=true;serverSave(srv);closeModal();toast('Фото отклонено','');render()}

function replyToReport(id){const ta=document.getElementById(`reply-${id}`);const text=ta?ta.value.trim():'';if(!text){toast('Введите текст','');return}const srv=serverLoad();const r=srv.reports.find(x=>x.id===id);if(!r)return;r.adminReply=text;r.adminRead=true;r.replyDate=Date.now();r.playerRead=false;serverSave(srv);toast('✓ Ответ отправлен','ok');render()}

function banPlayer(name,reason){const srv=serverLoad();if(!srv.players[name])return;srv.players[name].banned=true;srv.players[name].banReason=reason||'Нарушение правил';serverSave(srv);toast(`🚫 ${name} забанен`,'danger');render()}

function unbanPlayer(name){const srv=serverLoad();if(!srv.players[name])return;srv.players[name].banned=false;srv.players[name].banReason='';serverSave(srv);toast(`✓ ${name} разбанен`,'ok');render()}

function banPrompt(name){modal.innerHTML=`<div class="modal-box"><h2>Забанить игрока</h2><p>Игрок: <b style="color:var(--accent2)">${escapeHtml(name)}</b></p><textarea class="field" id="banReason" placeholder="Причина…" maxlength="200"></textarea><button class="btn danger" data-action="confirm-ban" data-name="${escapeHtml(name)}">🚫 Забанить</button><button class="btn ghost" data-action="close">Отмена</button></div>`;modal.classList.add('on')}

function changeAdminPass(){const val=document.getElementById('newAdminPass').value.trim();if(val.length<4){toast('Минимум 4 символа','');return}const srv=serverLoad();srv.adminPass=val;serverSave(srv);toast('✓ Пароль изменён','ok');render()}

function exportData(){const srv=serverLoad();const blob=new Blob([JSON.stringify(srv,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`omz-backup-${Date.now()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('📥 Скачано','ok')}

function resetServer(){modal.innerHTML=`<div class="modal-box"><h2 style="color:var(--danger)">Сбросить всё?</h2><p>Удалит всех игроков, фото и обращения.</p><button class="btn danger" data-action="confirm-reset">Да, удалить</button><button class="btn ghost" data-action="close">Отмена</button></div>`;modal.classList.add('on')}

document.addEventListener('click',e=>{
const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;
if(action==='close'){closeModal();return}
if(action==='go'){switchTab(el.dataset.tab);return}
if(action==='switch-account'){if(!confirm('Выйти из аккаунта? Прогресс сохранится.'))return;syncPlayerToServer();if(mjState&&mjState.timerId)clearInterval(mjState.timerId);S=null;localStorage.removeItem(KEY);location.reload();return}
if(action==='admin-login'){const pass=prompt('Введите пароль администратора:');if(pass===null)return;const srv=serverLoad();if(pass!==srv.adminPass){toast('Неверный пароль','danger');return}if(mjState&&mjState.timerId)clearInterval(mjState.timerId);syncPlayerToServer();S.isAdmin=true;S.name='Администратор';save();activeTab='admin';render();toast('🛡️ Вход в админ-панель','admin');return}
if(action==='quiz'){const task=taskById('quiz');if(!task||task.done)return;const q=QUIZ[S.daily.quizIndex];const i=Number(el.dataset.i);const btns=view.querySelectorAll('[data-action="quiz"]');btns.forEach((b,idx)=>{b.disabled=true;if(idx===q.c)b.classList.add('correct');else if(idx===i)b.classList.add('wrong')});if(i===q.c){S.quizzesCorrect=(S.quizzesCorrect||0)+1;completeTask('quiz');setTimeout(render,700)}else{toast('Неверно','');const t=taskById('quiz');if(t){t.done=true;t.reward=0;save()}setTimeout(render,900)}return}
if(action==='event'){openEvent(el.dataset.id);return}
if(action==='ev-photo'){openEventPhoto(el.dataset.id);return}
if(action==='ev-quiz'){openEventQuiz(el.dataset.id);return}
if(action==='ev-answer'){answerEvent(el.dataset.id,Number(el.dataset.i));return}
if(action==='send-support'){const msg=document.getElementById('supportMsg').value.trim();if(!msg){toast('Введите сообщение','');return}const preview=document.getElementById('supportPreview');const img=preview.querySelector('img');const image=img?img.src:'';const srv=serverLoad();const id=serverNextId(srv);srv.reports.push({id,from:S.name,message:msg,image,date:Date.now(),adminReply:'',adminRead:false,playerRead:true});serverSave(srv);toast('✓ Отправлено','ok');render();return}
if(action==='open-game'){currentGameId=el.dataset.id;screwsState=null;mjState=null;render();return}
if(action==='back-games'){if(mjState&&mjState.timerId){clearInterval(mjState.timerId);mjState.timerId=null}stopCurrentGame();currentGameId=null;screwsState=null;mjState=null;render();return}
if(action==='screw-retry'){initScrewsLevel(screwsState.level);refreshScrewsBoard();toast('Перезапуск','');return}
if(action==='screw-reshuffle'){reshuffleScrews();toast('Поле перемешано','');return}
if(action==='screw-next'){const n=Math.min(screwsState.level+1,500);initScrewsLevel(n);refreshScrewsBoard();return}
if(action==='screw-prev'){const p=Math.max(screwsState.level-1,1);initScrewsLevel(p);refreshScrewsBoard();return}
if(action==='mj-retry'){const lvl=mjState.level;initMjLevel(lvl);refreshMjBoard();toast('Перезапуск','');return}
if(action==='mj-shuffle'){shuffleMj();toast('Перемешано','');return}
if(action==='mj-next'){const n=Math.min(mjState.level+1,500);initMjLevel(n);refreshMjBoard();return}
if(action==='mj-prev'){const p=Math.max(mjState.level-1,1);initMjLevel(p);refreshMjBoard();return}
if(action==='admin-tab'){S.adminSubTab=el.dataset.sub;save();render();return}
if(action==='approve-photo'){approvePhoto(Number(el.dataset.id));return}
if(action==='reject-photo'){rejectPhoto(Number(el.dataset.id));return}
if(action==='confirm-reject'){confirmReject(Number(el.dataset.id));return}
if(action==='reply-report'){replyToReport(Number(el.dataset.id));return}
if(action==='ban-from-report'){const srv=serverLoad();const r=srv.reports.find(x=>x.id===Number(el.dataset.id));if(r)banPrompt(r.from);return}
if(action==='ban-player'){banPrompt(el.dataset.name);return}
if(action==='confirm-ban'){const reason=document.getElementById('banReason').value.trim();banPlayer(el.dataset.name,reason);closeModal();return}
if(action==='unban-player'){unbanPlayer(el.dataset.name);return}
if(action==='change-pass'){changeAdminPass();return}
if(action==='export-data'){exportData();return}
if(action==='reset-server'){resetServer();return}
if(action==='confirm-reset'){localStorage.removeItem(SERVER_KEY);closeModal();toast('Сервер сброшен','danger');render();return}
if(action==='logout-admin'){if(mjState&&mjState.timerId)clearInterval(mjState.timerId);S.isAdmin=false;localStorage.removeItem(KEY);location.reload();return}
});

document.addEventListener('change',e=>{if(e.target&&e.target.id==='supportPhoto'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{const preview=document.getElementById('supportPreview');if(preview)preview.innerHTML=`<img class="photo-prev" src="${ev.target.result}">`;const lbl=document.getElementById('photoLabelText');if(lbl)lbl.textContent='Фото прикреплено'};r.readAsDataURL(f)}});

function switchTab(tab){if(tab!=='game'){if(mjState&&mjState.timerId){clearInterval(mjState.timerId);mjState.timerId=null}stopCurrentGame();currentGameId=null;screwsState=null;mjState=null}activeTab=tab;document.querySelectorAll('nav button').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab)});render();window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('nav button').forEach(b=>{b.addEventListener('click',()=>switchTab(b.dataset.tab))});

window.addEventListener('resize',()=>{if(activeTab==='game'&&currentGameId==='mahjong'&&mjState&&!mjState.busy){refreshMjBoard()}});

function boot(){setTimeout(()=>{document.getElementById('splash').classList.add('hide');setTimeout(()=>{const saved=load();if(saved&&saved.name){S=saved;if(!S.isAdmin&&checkBanOnBoot())return;if(!S.screws)S.screws={unlocked:1,completed:0};if(!S.mahjong)S.mahjong={unlocked:1,completed:0};if(!S.adminSubTab)S.adminSubTab='photos';ensureDaily();if(!S.isAdmin){const lt=taskById('login');if(lt&&!lt.done)completeTask('login');syncPlayerToServer()}document.getElementById('login').style.display='none';document.getElementById('app').classList.add('on');render()}else{document.getElementById('login').style.display='flex'}},750)},2100)}

document.getElementById('startBtn').addEventListener('click',()=>{const name=document.getElementById('nameInput').value.trim();const pass=document.getElementById('passInput').value.trim();if(name.length<2){toast('Введи имя (минимум 2 символа)');return}if(name.toLowerCase()==='admin'){const srv=serverLoad();if(pass!==srv.adminPass){toast('Неверный пароль','danger');return}S=defaultState();S.name='Администратор';S.isAdmin=true;save();document.getElementById('login').style.display='none';document.getElementById('app').classList.add('on');render();setTimeout(()=>toast('🛡️ Вход в админ-панель','admin'),350);return}const srv=serverLoad();if(srv.players[name]&&srv.players[name].banned){S=defaultState();S.name=name;S.banned=true;S.banReason=srv.players[name].banReason||'Нарушение правил';save();document.getElementById('login').style.display='none';showBanScreen();return}S=defaultState();S.name=name;S.daily=makeDaily();save();syncPlayerToServer();const lt=taskById('login');if(lt&&!lt.done)completeTask('login');document.getElementById('login').style.display='none';document.getElementById('app').classList.add('on');render();setTimeout(()=>toast(`Добро пожаловать, ${name}!`,'gold'),350)});

document.getElementById('nameInput').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('startBtn').click()});
document.getElementById('passInput').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('startBtn').click()});

boot();
</script>
</body>
</html>
