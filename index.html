<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ОМЗ • Стальной Путь</title>
<style>
:root{--card:rgba(255,255,255,.045);--line:rgba(255,255,255,.09);--accent:#ff6b1a;--accent2:#ffb347;--hot:#ff3d00;--text:#e8ecf3;--muted:#8b96ab;--ok:#38d39f;--danger:#e53935}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0b0d12;color:var(--text);overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 80% 60% at 15% 0%,rgba(255,107,26,.18),transparent 60%),radial-gradient(ellipse 70% 50% at 90% 100%,rgba(255,61,0,.12),transparent 60%),radial-gradient(ellipse 60% 50% at 50% 50%,#171b24,#0b0d12 75%)}
#sparks{position:fixed;inset:0;z-index:1;pointer-events:none}
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:radial-gradient(ellipse at 50% 45%,#1d1208,#08090d 70%);transition:opacity .8s,visibility .8s}
#splash.hide{opacity:0;visibility:hidden}
.splash-logo{width:104px;height:104px;border-radius:26px;display:grid;place-items:center;background:linear-gradient(145deg,#ff8a3d,#c73c00);box-shadow:0 0 60px rgba(255,107,26,.55),inset 0 2px 0 rgba(255,255,255,.35);font-size:52px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.splash-title{font-size:28px;font-weight:800;letter-spacing:3px}
.splash-sub{color:var(--muted);font-size:13px;letter-spacing:5px;text-transform:uppercase}
.loader{width:200px;height:3px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.loader i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));animation:load 1.9s ease forwards}
@keyframes load{to{width:100%}}
#app{position:relative;z-index:2;max-width:920px;margin:0 auto;padding:0 14px 110px;display:none}
#app.on{display:block}
#login{position:relative;z-index:3;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:100%;max-width:400px;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:26px;padding:36px 28px;backdrop-filter:blur(18px);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.login-card h1{font-size:24px;margin:18px 0 6px;text-align:center}
.login-card p{color:var(--muted);font-size:14px;text-align:center;margin-bottom:26px;line-height:1.5}
.login-logo{width:76px;height:76px;margin:0 auto;border-radius:22px;display:grid;place-items:center;font-size:38px;background:linear-gradient(145deg,#ff8a3d,#c73c00);box-shadow:0 0 44px rgba(255,107,26,.45),inset 0 2px 0 rgba(255,255,255,.3)}
.field{width:100%;padding:15px 18px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--text);font-size:15px;outline:none;margin-bottom:10px;font-family:inherit}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(255,107,26,.13)}
textarea.field{resize:vertical;min-height:100px}
.btn{width:100%;padding:15px;border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--hot));color:#fff;margin-top:14px;transition:.2s;box-shadow:0 10px 26px rgba(255,61,0,.32);font-family:inherit}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(255,61,0,.45)}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:rgba(255,255,255,.1);box-shadow:none}
.btn.danger{background:linear-gradient(135deg,#e53935,#b71c1c)}
.btn.success{background:linear-gradient(135deg,#38d39f,#1a9c72)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:none}
header{position:sticky;top:0;z-index:20;margin:0 -14px 18px;padding:16px 18px 14px;background:linear-gradient(180deg,rgba(11,13,18,.96) 60%,rgba(11,13,18,0));backdrop-filter:blur(14px)}
.hrow{display:flex;align-items:center;gap:13px}
.avatar{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;font-size:22px;background:linear-gradient(145deg,#ff8a3d,#c73c00);box-shadow:0 0 22px rgba(255,107,26,.4)}
.avatar.admin{background:linear-gradient(145deg,#9c27b0,#4a148c)}
.hinfo{flex:1;min-width:0}
.hname{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrank{font-size:12.5px;color:var(--accent2);font-weight:600}
.admin-badge{display:inline-block;padding:2px 8px;background:linear-gradient(135deg,#9c27b0,#4a148c);color:#fff;font-size:10px;font-weight:800;border-radius:6px;margin-left:6px;letter-spacing:1px}
.hpoints{text-align:right;font-weight:800;font-size:19px;color:var(--accent2);text-shadow:0 0 18px rgba(255,179,71,.45)}
.hpoints small{display:block;font-size:10px;color:var(--muted);font-weight:600;letter-spacing:1px}
.h-actions{display:flex;gap:8px;margin-top:10px}
.h-actions .btn{padding:8px;font-size:11.5px;margin:0;flex:1;font-weight:600}
nav{display:flex;gap:6px;background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:16px;padding:5px;margin-bottom:20px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:1;min-width:66px;padding:10px 6px;border:none;border-radius:12px;background:transparent;color:var(--muted);font-size:11.5px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit;position:relative}
nav button .ic{font-size:17px}
nav button.active{background:linear-gradient(135deg,var(--accent),var(--hot));color:#fff;box-shadow:0 6px 18px rgba(255,61,0,.35)}
nav button.admin-btn.active{background:linear-gradient(135deg,#9c27b0,#4a148c)}
.nav-badge{position:absolute;top:4px;right:8px;min-width:16px;height:16px;padding:0 4px;background:var(--danger);border-radius:8px;font-size:10px;font-weight:800;color:#fff;display:grid;place-items:center;line-height:1}
.card{background:linear-gradient(160deg,rgba(255,255,255,.062),rgba(255,255,255,.022));border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.card.admin-card{background:linear-gradient(160deg,rgba(156,39,176,.12),rgba(255,255,255,.02));border-color:rgba(156,39,176,.3)}
.card-title{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card-title .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.card.admin-card .card-title .dot{background:#9c27b0;box-shadow:0 0 12px #9c27b0}
.section-h{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);font-weight:700;margin:22px 4px 10px}
.rank-badge{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:linear-gradient(135deg,rgba(255,107,26,.16),rgba(255,61,0,.05));border:1px solid rgba(255,107,26,.28);margin-bottom:14px}
.rank-ic{font-size:34px}
.rank-name{font-size:17px;font-weight:800}
.rank-next{font-size:12px;color:var(--muted);margin-top:2px}
.progress{height:9px;border-radius:9px;background:rgba(0,0,0,.42);overflow:hidden;margin-top:10px;border:1px solid rgba(255,255,255,.05)}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:9px;transition:width .7s}
.ladder{display:flex;flex-direction:column;gap:7px}
.step{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid transparent}
.step.done{background:rgba(56,211,159,.07);border-color:rgba(56,211,159,.22)}
.step.current{background:rgba(255,107,26,.12);border-color:rgba(255,107,26,.4);box-shadow:0 0 22px rgba(255,107,26,.14)}
.step .s-ic{font-size:19px;width:26px;text-align:center;filter:grayscale(1);opacity:.45}
.step.done .s-ic,.step.current .s-ic{filter:none;opacity:1}
.step .s-name{flex:1;font-size:13.5px;font-weight:600;color:var(--muted)}
.step.done .s-name,.step.current .s-name{color:var(--text)}
.step .s-pts{font-size:11.5px;color:var(--muted);font-weight:700}
.step.done .s-pts{color:var(--ok)}
.task{display:flex;align-items:center;gap:13px;padding:14px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--line);margin-bottom:9px}
.task.done{background:rgba(56,211,159,.07);border-color:rgba(56,211,159,.25)}
.task .t-ic{font-size:21px;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.06);flex-shrink:0}
.task.done .t-ic{background:rgba(56,211,159,.15)}
.task .t-body{flex:1;min-width:0}
.task .t-name{font-size:13.5px;font-weight:600}
.task .t-sub{font-size:11.5px;color:var(--muted);margin-top:3px}
.task .t-reward{font-size:12px;font-weight:800;color:var(--accent2);background:rgba(255,107,26,.12);padding:6px 11px;border-radius:10px;border:1px solid rgba(255,107,26,.22);white-space:nowrap}
.task.done .t-reward{color:var(--ok);background:rgba(56,211,159,.12);border-color:rgba(56,211,159,.25)}
.event{border-radius:18px;overflow:hidden;margin-bottom:14px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02))}
.event-top{height:92px;position:relative;display:flex;align-items:flex-end;padding:14px 16px;background:linear-gradient(135deg,#3a1d08,#1a1f2b)}
.event-top::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 80% 20%,rgba(255,107,26,.4),transparent 55%),repeating-linear-gradient(115deg,rgba(255,255,255,.03) 0 3px,transparent 3px 9px)}
.event-top h3{position:relative;z-index:1;font-size:16px;font-weight:800;text-shadow:0 2px 10px rgba(0,0,0,.7)}
.event-body{padding:15px 16px}
.event-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:11px}
.chip{font-size:11px;padding:5px 11px;border-radius:9px;background:rgba(255,255,255,.07);color:var(--muted);font-weight:600;border:1px solid var(--line)}
.chip.mega{color:#fff;background:linear-gradient(135deg,#ff6b1a,#ff3d00);border-color:transparent;font-weight:800}
.chip.pending{color:#ffb347;background:rgba(255,179,71,.14);border-color:rgba(255,179,71,.35)}
.chip.approved{color:var(--ok);background:rgba(56,211,159,.14);border-color:rgba(56,211,159,.35)}
.chip.rejected{color:var(--danger);background:rgba(229,57,53,.14);border-color:rgba(229,57,53,.35)}
.chip.banned{color:#fff;background:linear-gradient(135deg,#e53935,#b71c1c);border-color:transparent}
.event p{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:13px}
.lb-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.032);margin-bottom:7px;border:1px solid transparent}
.lb-row.me{background:linear-gradient(135deg,rgba(255,107,26,.16),rgba(255,107,26,.05));border-color:rgba(255,107,26,.35)}
.lb-pos{width:30px;font-weight:800;font-size:15px;color:var(--muted);text-align:center;flex-shrink:0}
.lb-row:nth-child(1) .lb-pos{color:#ffd35c}
.lb-row:nth-child(2) .lb-pos{color:#cfd6e2}
.lb-row:nth-child(3) .lb-pos{color:#e0954f}
.lb-av{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:13px;font-weight:800;background:rgba(255,255,255,.08);flex-shrink:0;color:var(--muted)}
.lb-row.me .lb-av{background:linear-gradient(145deg,#ff8a3d,#c73c00);color:#fff}
.lb-name{flex:1;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-rank{font-size:11px;color:var(--muted);margin-top:2px}
.lb-pts{font-weight:800;font-size:14px;color:var(--accent2);white-space:nowrap}
.game-wrap{text-align:center}
.gauge{position:relative;height:56px;border-radius:16px;background:rgba(0,0,0,.45);border:1px solid var(--line);overflow:hidden;margin:8px 0 6px}
.gauge .zone{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,rgba(56,211,159,.28),rgba(56,211,159,.5));border-left:2px solid var(--ok);border-right:2px solid var(--ok)}
.gauge .needle{position:absolute;top:-3px;bottom:-3px;width:5px;border-radius:4px;background:linear-gradient(180deg,#fff,var(--accent));box-shadow:0 0 18px var(--accent);transform:translateX(-50%)}
.gauge .heat{position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,61,0,.35),rgba(255,179,71,.05),rgba(255,61,0,.35));opacity:.5}
.game-info{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:600;padding:0 4px}
.game-result{font-size:15px;font-weight:700;margin:14px 0 4px;min-height:22px}
.game-card{display:flex;align-items:center;gap:14px;padding:16px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--line);margin-bottom:10px;cursor:pointer;transition:.2s}
.game-card:hover{background:rgba(255,107,26,.1);border-color:rgba(255,107,26,.35);transform:translateX(3px)}
.game-card.locked{opacity:.55;cursor:not-allowed}
.game-card.locked:hover{background:rgba(255,255,255,.035);border-color:var(--line);transform:none}
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted);cursor:pointer;font-size:12px;font-weight:700;margin-bottom:14px;font-family:inherit}
.back-btn:hover{color:var(--text);background:rgba(255,255,255,.1)}
.timer-bar{height:8px;background:rgba(0,0,0,.4);border-radius:8px;overflow:hidden;margin:12px 0;border:1px solid var(--line)}
.timer-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--accent));transition:width .1s linear;border-radius:8px}
.mem-pad{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.mem-btn{aspect-ratio:1;border-radius:20px;border:2px solid var(--line);background:rgba(255,255,255,.05);display:grid;place-items:center;font-size:44px;cursor:pointer;transition:.15s}
.mem-btn.flash{background:linear-gradient(145deg,#ff8a3d,#c73c00);border-color:#ff8a3d;box-shadow:0 0 40px rgba(255,107,26,.6);transform:scale(.96)}
.forge-btn{width:100%;padding:36px 20px;border-radius:20px;border:none;font-size:22px;font-weight:800;background:linear-gradient(145deg,#ff8a3d,#c73c00);color:#fff;cursor:pointer;box-shadow:0 10px 30px rgba(255,61,0,.4);font-family:inherit;letter-spacing:1px}
.forge-btn:active{transform:scale(.97)}
.forge-btn:disabled{opacity:.4;cursor:not-allowed}
.big-stat{font-size:44px;font-weight:800;color:var(--accent2);text-align:center;margin:8px 0;text-shadow:0 0 26px rgba(255,179,71,.5)}
.cap-bar{height:10px;border-radius:10px;background:rgba(0,0,0,.4);overflow:hidden;border:1px solid var(--line);margin:6px 0 12px}
.cap-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--accent2));border-radius:10px;transition:width .5s}
.cap-bar.full i{background:linear-gradient(90deg,var(--danger),#b71c1c)}
.sw-header{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.sw-stat{font-size:11.5px;color:var(--muted);font-weight:600;background:rgba(0,0,0,.35);border:1px solid var(--line);padding:7px 8px;border-radius:9px;text-align:center}
.sw-stat b{color:var(--accent2);display:block;font-size:14px;margin-top:2px}
.sw-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:8px;font-size:10.5px;font-weight:800;letter-spacing:.4px}
.sw-badge.easy{background:rgba(56,211,159,.16);color:var(--ok);border:1px solid rgba(56,211,159,.4)}
.sw-badge.medium{background:rgba(255,179,71,.16);color:var(--accent2);border:1px solid rgba(255,179,71,.4)}
.sw-badge.hard{background:rgba(255,61,0,.16);color:#ff8a80;border:1px solid rgba(255,61,0,.4)}
.sw-badge.insane{background:linear-gradient(135deg,#e53935,#b71c1c);color:#fff;border:1px solid transparent}
.sw-rules{background:linear-gradient(160deg,rgba(255,107,26,.1),rgba(255,255,255,.02));border:1px solid rgba(255,107,26,.25);border-radius:12px;padding:10px 13px;font-size:11.5px;color:var(--muted);line-height:1.55;margin-bottom:10px}
.sw-rules b{color:var(--text)}
.sw-stage{position:relative;padding:12px 5px 5px;background:linear-gradient(180deg,#1a1410,#0c0906);border-radius:16px;border:1px solid rgba(255,255,255,.06);min-height:240px;max-height:64vh;overflow-y:auto;overflow-x:hidden}
.sw-stage::-webkit-scrollbar{width:5px}
.sw-stage::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}
.sw-ground{position:absolute;left:8%;right:8%;bottom:10px;height:10px;background:linear-gradient(180deg,#3a2418,#1a0f08);border-radius:5px;box-shadow:0 4px 12px rgba(0,0,0,.7);z-index:1}
.sw-stack{position:relative;z-index:3;padding-bottom:26px;min-height:180px;display:flex;flex-direction:column;justify-content:flex-end;gap:5px}
.sw-board{position:relative;margin:0 auto;padding:10px 12px;border-radius:9px;background:linear-gradient(180deg,rgba(255,255,255,.1) 0%,transparent 22%,transparent 78%,rgba(0,0,0,.3) 100%),repeating-linear-gradient(92deg,rgba(0,0,0,.07) 0 3px,transparent 3px 12px),linear-gradient(180deg,#a37a52 0%,#7c5a3a 45%,#5a3d26 100%);box-shadow:0 7px 14px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.25),inset 0 -3px 6px rgba(0,0,0,.45);border:1px solid #4a2f1e;display:flex;align-items:center;justify-content:center;gap:9px;transition:transform .5s,opacity .4s,box-shadow .2s,filter .25s}
.sw-board.compact{padding:8px;gap:6px}
.sw-board.tiny{padding:6px;gap:5px}
.sw-board.active{box-shadow:0 7px 14px rgba(0,0,0,.55),0 0 0 2px rgba(255,179,71,.35),inset 0 2px 0 rgba(255,255,255,.25)}
.sw-board.locked{filter:brightness(.72) saturate(.6)}
.sw-board.locked::after{content:'🔒';position:absolute;top:-9px;right:-9px;font-size:15px;background:#2a1a10;border:2px solid #6a4a2e;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;z-index:5;box-shadow:0 3px 6px rgba(0,0,0,.6)}
.sw-board.full-unlocked{box-shadow:0 7px 14px rgba(0,0,0,.55),0 0 0 3px rgba(56,211,159,.75),0 0 26px rgba(56,211,159,.5)}
.sw-board.full-unlocked::after{content:'🔓';position:absolute;top:-9px;right:-9px;font-size:15px;background:#0a2a1e;border:2px solid #38d39f;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;z-index:5}
.sw-board.falling{transform:translateY(420px) rotate(-8deg) scale(.9);opacity:0;pointer-events:none}
.sw-hole{width:42px;height:42px;border-radius:50%;position:relative;background:radial-gradient(circle at 50% 40%,#3a2418,#1a0d06 78%);box-shadow:inset 0 5px 9px rgba(0,0,0,.9);display:grid;place-items:center;flex-shrink:0;transition:transform .15s,box-shadow .2s}
.sw-board.compact .sw-hole{width:36px;height:36px}
.sw-board.tiny .sw-hole{width:32px;height:32px}
.sw-hole.empty{background:radial-gradient(circle at 50% 45%,#241609,#0b0705 80%)}
.sw-hole.can-drop{box-shadow:inset 0 5px 9px rgba(0,0,0,.9),0 0 0 2px rgba(56,211,159,.7),0 0 14px rgba(56,211,159,.6);cursor:pointer}
.sw-hole.selected{box-shadow:inset 0 5px 9px rgba(0,0,0,.9),0 0 0 3px var(--accent2),0 0 22px 4px rgba(255,179,71,.7);transform:scale(1.08)}
.sw-hole.clickable{cursor:pointer}
.sw-hole.not-clickable{cursor:not-allowed}
.screw{width:30px;height:30px;border-radius:50%;position:relative;box-shadow:inset 0 -4px 8px rgba(0,0,0,.5),inset 0 3px 6px rgba(255,255,255,.55),0 3px 5px rgba(0,0,0,.65);transition:transform .2s}
.sw-board.compact .screw{width:26px;height:26px}
.sw-board.tiny .screw{width:22px;height:22px}
.screw::before,.screw::after{content:'';position:absolute;top:50%;left:50%;background:rgba(0,0,0,.7);border-radius:2px}
.screw::before{width:15px;height:3px;transform:translate(-50%,-50%)}
.screw::after{width:3px;height:15px;transform:translate(-50%,-50%)}
.sw-board.compact .screw::before{width:12px;height:2.5px}
.sw-board.compact .screw::after{width:2.5px;height:12px}
.sw-board.tiny .screw::before{width:10px;height:2px}
.sw-board.tiny .screw::after{width:2px;height:10px}

function fmt(n){return n.toLocaleString('ru-RU')}
function rankIndex(p){let i=0;for(let k=0;k<RANKS.length;k++)if(p>=RANKS[k].min)i=k;return i}
function rankOf(p){return RANKS[rankIndex(p)]}
function nextRank(p){const i=rankIndex(p);return i<RANKS.length-1?RANKS[i+1]:null}

function renderHeader(){if(S.isAdmin){document.getElementById('hAvatar').textContent='🛡️';document.getElementById('hAvatar').classList.add('admin');document.getElementById('hName').innerHTML='Администратор<span class="admin-badge">ADMIN</span>';document.getElementById('hRank').textContent='Служба поддержки ОМЗ';document.getElementById('hPoints').innerHTML='—<small>РЕЖИМ</small>';return}const r=rankOf(S.points);document.getElementById('hAvatar').textContent=r.icon;document.getElementById('hAvatar').classList.remove('admin');document.getElementById('hName').textContent=S.name;document.getElementById('hRank').textContent=r.name;document.getElementById('hPoints').innerHTML=fmt(S.points)+'<small>РЕЙТИНГ</small>'}

function render(){renderHeader();updateNavBadge();if(activeTab==='home')view.innerHTML=viewHome();else if(activeTab==='tasks')view.innerHTML=viewTasks();else if(activeTab==='events')view.innerHTML=viewEvents();else if(activeTab==='game'){view.innerHTML=viewGame();setupGame()}else if(activeTab==='top')view.innerHTML=viewTop();else if(activeTab==='support')view.innerHTML=viewSupport();else if(activeTab==='admin')view.innerHTML=viewAdmin()}

function updateNavBadge(){const adminBtn=document.querySelector('[data-tab="admin"]');adminBtn.style.display=S.isAdmin?'flex':'none';let existing=adminBtn.querySelector('.nav-badge');if(existing)existing.remove();if(S.isAdmin){const srv=serverLoad();const pending=srv.pendingEvents.filter(p=>p.status==='pending').length;const reports=srv.reports.filter(r=>!r.adminRead).length;const total=pending+reports;if(total>0){const b=document.createElement('span');b.className='nav-badge';b.textContent=total>99?'99+':total;adminBtn.appendChild(b)}}else{const srv=serverLoad();const unreadReplies=srv.reports.filter(r=>r.from===S.name&&r.adminReply&&!r.playerRead).length;const supportBtn=document.querySelector('[data-tab="support"]');let b=supportBtn.querySelector('.nav-badge');if(b)b.remove();if(unreadReplies>0){const nb=document.createElement('span');nb.className='nav-badge';nb.textContent=unreadReplies;supportBtn.appendChild(nb)}}}

function viewHome(){if(S.isAdmin)return viewAdminHome();const r=rankOf(S.points),nr=nextRank(S.points);const prevMin=r.min,nextMin=nr?nr.min:r.min;const pct=nr?Math.min(100,((S.points-prevMin)/(nextMin-prevMin))*100):100;const dailyDone=S.daily?S.daily.tasks.filter(t=>t.done).length:0;const dailyTotal=S.daily?S.daily.tasks.length:4;const gameToday=S.daily?.gamePointsToday||0,puzzleToday=S.daily?.puzzlePointsToday||0;let ladder='';const curIdx=rankIndex(S.points);RANKS.forEach((rk,i)=>{const cls=i<curIdx?'done':(i===curIdx?'current':'');ladder+=`<div class="step ${cls}"><div class="s-ic">${rk.icon}</div><div class="s-name">${rk.name}</div><div class="s-pts">${i<=curIdx?'✓':fmt(rk.min)+' очк.'}</div></div>`});return`
<div class="rank-badge"><div class="rank-ic">${r.icon}</div><div style="flex:1;min-width:0"><div class="rank-name">${r.name}</div><div class="rank-next">${nr?`До звания «${nr.name}» — ${fmt(nextMin-S.points)} очк.`:'Максимальное звание!'}</div><div class="progress"><i style="width:${pct}%"></i></div></div></div>
<div class="card" style="background:linear-gradient(160deg,rgba(255,107,26,.2),rgba(255,61,0,.06));border-color:rgba(255,107,26,.45)"><div class="card-title"><span class="dot"></span>🎭 Главный источник рейтинга</div><div style="font-size:14px;line-height:1.7;font-weight:600">Один поход в ДК = <b style="color:var(--accent2);font-size:17px">3000–4000 очков</b><br><span style="font-size:12.5px;color:var(--muted);font-weight:500">В 25 раз больше, чем можно заработать в играх за день.</span></div><button class="btn" data-action="go" data-tab="events" style="margin-top:14px">Смотреть мероприятия →</button></div>
<div class="card"><div class="card-title"><span class="dot"></span>Твоя статистика</div><div class="stat-grid"><div class="stat"><div class="s-val">${fmt(S.points)}</div><div class="s-lbl">РЕЙТИНГ</div></div><div class="stat"><div class="s-val">${S.streak||1}🔥</div><div class="s-lbl">ДНЕЙ ПОДРЯД</div></div><div class="stat"><div class="s-val">${S.events.length}/${EVENTS.length}</div><div class="s-lbl">ИВЕНТОВ</div></div></div></div>
<div class="card" data-action="go" data-tab="tasks" style="cursor:pointer"><div class="card-title"><span class="dot"></span>Задания на сегодня</div><div style="font-size:13.5px;color:var(--muted);line-height:1.5;margin-bottom:10px">Выполнено <b style="color:var(--accent2)">${dailyDone} из ${dailyTotal}</b>.</div><div class="progress"><i style="width:${(dailyDone/dailyTotal)*100}%"></i></div></div>
<div class="card"><div class="card-title"><span class="dot"></span>Дневные лимиты на игры</div><div style="font-size:12.5px;color:var(--muted);margin-bottom:8px">Мини-игры: <b style="color:var(--accent2)">${gameToday} / ${DAILY_GAME_CAP}</b></div><div class="cap-bar ${gameToday>=DAILY_GAME_CAP?'full':''}"><i style="width:${Math.min(100,(gameToday/DAILY_GAME_CAP)*100)}%"></i></div><div style="font-size:12.5px;color:var(--muted);margin-bottom:8px">Головоломки: <b style="color:var(--accent2)">${puzzleToday} / ${DAILY_PUZZLE_CAP}</b></div><div class="cap-bar ${puzzleToday>=DAILY_PUZZLE_CAP?'full':''}"><i style="width:${Math.min(100,(puzzleToday/DAILY_PUZZLE_CAP)*100)}%"></i></div></div>
<div class="section-h">Карьерная лестница</div><div class="card"><div class="ladder">${ladder}</div></div>`}

function viewAdminHome(){const srv=serverLoad();const pending=srv.pendingEvents.filter(p=>p.status==='pending').length;const unread=srv.reports.filter(r=>!r.adminRead).length;const banned=Object.values(srv.players).filter(p=>p.banned).length;const playersCount=Object.keys(srv.players).length;const totalPoints=Object.values(srv.players).reduce((s,p)=>s+p.points,0);return`<div class="card admin-card"><div class="card-title"><span class="dot"></span>Панель администратора</div><div style="font-size:13px;color:var(--muted);line-height:1.6">Проверяйте фотоотчёты, отвечайте на обращения, управляйте игроками.</div></div><div class="card"><div class="card-title"><span class="dot"></span>Сводка</div><div class="stat-grid"><div class="stat"><div class="s-val">${playersCount}</div><div class="s-lbl">ИГРОКОВ</div></div><div class="stat"><div class="s-val">${pending}</div><div class="s-lbl">ФОТО</div></div><div class="stat"><div class="s-val">${unread}</div><div class="s-lbl">ОБРАЩЕНИЙ</div></div></div><div class="stat-grid" style="margin-top:9px"><div class="stat"><div class="s-val">${banned}</div><div class="s-lbl">ЗАБАНЕНО</div></div><div class="stat"><div class="s-val">${fmt(totalPoints)}</div><div class="s-lbl">ОЧКОВ ВСЕГО</div></div><div class="stat"><div class="s-val">${srv.reports.length}</div><div class="s-lbl">ВСЕГО ОБРАЩ.</div></div></div></div>`}

function viewTasks(){if(S.isAdmin)return viewAdminHome();if(!S.daily)return'<div class="empty">Загрузка…</div>';const done=S.daily.tasks.filter(t=>t.done).length,total=S.daily.tasks.length;let rows=S.daily.tasks.map(t=>{let sub=t.sub;if(t.id==='game3'&&!t.done)sub=`Прогресс: ${t.prog||0} из ${t.goal}`;return`<div class="task ${t.done?'done':''}"><div class="t-ic">${t.done?'✅':taskIcon(t.id)}</div><div class="t-body"><div class="t-name">${t.name}</div><div class="t-sub">${sub}</div></div><div class="t-reward">+${t.reward}</div></div>`}).join('');const quizTask=taskById('quiz'),q=QUIZ[S.daily.quizIndex];let quizBlock='';if(quizTask&&!quizTask.done){quizBlock=`<div class="card" style="border-color:rgba(255,107,26,.3);background:linear-gradient(160deg,rgba(255,107,26,.1),rgba(255,255,255,.02))"><div class="card-title"><span class="dot"></span>Вопрос дня</div><div style="font-size:14.5px;font-weight:600;line-height:1.5;margin-bottom:14px">${q.q}</div>${q.a.map((a,i)=>`<button class="opt" data-action="quiz" data-i="${i}">${a}</button>`).join('')}</div>`}return`<div class="card"><div class="card-title"><span class="dot"></span>Ежедневные задания</div><div style="font-size:12.5px;color:var(--muted);margin-bottom:14px">Выполнено <b style="color:var(--accent2)">${done} из ${total}</b></div>${rows}</div>${quizBlock}`}
function taskIcon(id){return{login:'📅',quiz:'❓',game:'🎮',game3:'🏅'}[id]||'📌'}

function viewEvents(){if(S.isAdmin)return viewAdminHome();const srv=serverLoad();let html=`<div class="card" style="background:linear-gradient(160deg,rgba(255,107,26,.15),rgba(255,255,255,.02));border-color:rgba(255,107,26,.35)"><div class="card-title"><span class="dot"></span>🎭 Мероприятия ДК</div><div style="font-size:13.5px;line-height:1.6;font-weight:600">Главный источник рейтинга. Каждое посещение — <b style="color:var(--accent2)">3000–4000 очков</b>.</div></div>`;EVENTS.forEach(ev=>{const done=S.events.includes(ev.id);const pendingPhoto=srv.pendingEvents.find(p=>p.playerName===S.name&&p.eventId===ev.id&&p.status==='pending');const rejectedPhoto=srv.pendingEvents.find(p=>p.playerName===S.name&&p.eventId===ev.id&&p.status==='rejected');let btn='';if(done){btn=`<button class="btn ghost" disabled>✓ Участие подтверждено</button>`}else if(pendingPhoto){btn=`<button class="btn ghost" disabled>⏳ Фото на проверке</button>`}else{btn=`<button class="btn" data-action="event" data-id="${ev.id}">Подтвердить участие</button>`}let rejectedNote='';if(rejectedPhoto&&!done){rejectedNote=`<div style="font-size:12px;color:var(--danger);font-weight:700;margin-top:8px">❌ Фото отклонено${rejectedPhoto.adminNote?': '+rejectedPhoto.adminNote:''}</div>`}html+=`<div class="event"><div class="event-top"><h3>${ev.title}</h3></div><div class="event-body"><div class="event-meta"><span class="chip mega">+${fmt(ev.points)} рейтинга</span><span class="chip">${ev.tag}</span><span class="chip">${ev.date}</span></div><div style="font-size:11.5px;color:var(--muted);margin-bottom:8px">📍 ${ev.place}</div><p>${ev.desc}</p>${btn}${rejectedNote}</div></div>`});return html}

function viewTop(){if(S.isAdmin)return viewAdminHome();const srv=serverLoad(),myRank=rankOf(S.points),list=[];Object.values(srv.players).forEach(p=>{if(p.name!==S.name&&!p.banned)list.push({name:p.name,points:p.points,rank:rankOf(p.points).name,me:false})});NPCS.forEach(x=>list.push({name:x.n,points:x.p,rank:x.r,me:false}));list.push({name:S.name,points:S.points,rank:myRank.name,me:true});list.sort((a,b)=>b.points-a.points);const myPos=list.findIndex(x=>x.me)+1;let rows=list.slice(0,30).map((x,i)=>{const initials=x.name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();return`<div class="lb-row ${x.me?'me':''}"><div class="lb-pos">${i+1}</div><div class="lb-av">${x.me?rankOf(x.points).icon:initials}</div><div style="flex:1;min-width:0"><div class="lb-name">${x.me?x.name+' (ты)':x.name}</div><div class="lb-rank">${x.rank}</div></div><div class="lb-pts">${fmt(x.points)}</div></div>`}).join('');return`<div class="card" style="background:linear-gradient(160deg,rgba(255,179,71,.12),rgba(255,255,255,.02));border-color:rgba(255,179,71,.25)"><div class="card-title"><span class="dot"></span>Твоя позиция</div><div style="display:flex;align-items:center;gap:16px"><div style="font-size:34px;font-weight:800;color:var(--accent2)">#${myPos}</div><div style="flex:1"><div style="font-size:13.5px;font-weight:600">${fmt(S.points)} очков</div><div style="font-size:12px;color:var(--muted);margin-top:3px">${myRank.name}</div></div></div></div><div class="section-h">Таблица лидеров</div>${rows}`}

function viewSupport(){if(S.isAdmin)return viewAdminHome();const srv=serverLoad();const myReports=srv.reports.filter(r=>r.from===S.name).sort((a,b)=>b.date-a.date);let changed=false;myReports.forEach(r=>{if(r.adminReply&&!r.playerRead){r.playerRead=true;changed=true}});if(changed)serverSave(srv);setTimeout(updateNavBadge,10);let reportsHtml='';if(myReports.length===0){reportsHtml=`<div class="empty"><span class="e-ic">💬</span>У вас пока нет обращений</div>`}else{reportsHtml=myReports.map(r=>`<div class="report-card"><div class="report-head"><div class="report-from">Вы</div><div class="report-date">${new Date(r.date).toLocaleString('ru-RU')}</div></div><div class="report-text">${escapeHtml(r.message)}</div>${r.image?`<img class="report-img" src="${r.image}">`:''}${r.adminReply?`<div style="background:rgba(156,39,176,.12);border:1px solid rgba(156,39,176,.3);border-radius:10px;padding:12px;margin-top:10px"><div style="font-size:11px;color:#c48ddb;font-weight:800;letter-spacing:1px;margin-bottom:6px">🛡️ ОТВЕТ АДМИНА</div><div style="font-size:13.5px;line-height:1.55;white-space:pre-wrap">${escapeHtml(r.adminReply)}</div></div>`:`<div style="font-size:11.5px;color:var(--muted);margin-top:8px;font-weight:600">⏳ Ожидает ответа</div>`}</div>`).join('')}return`<div class="card"><div class="card-title"><span class="dot"></span>Служба поддержки</div><textarea class="field" id="supportMsg" placeholder="Опишите вопрос…" maxlength="800"></textarea><label class="upload-zone" for="supportPhoto" style="margin-top:10px;padding:16px"><span class="u-ic" style="font-size:22px">📎</span><span id="photoLabelText">Прикрепить фото</span></label><input type="file" id="supportPhoto" accept="image/*" style="display:none"><div id="supportPreview"></div><button class="btn" data-action="send-support">Отправить</button></div><div class="section-h">Мои обращения</div>${reportsHtml}`}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function viewAdmin(){if(!S.isAdmin)return viewAdminHome();const sub=S.adminSubTab||'photos';let body='';if(sub==='photos')body=viewAdminPhotos();else if(sub==='reports')body=viewAdminReports();else if(sub==='players')body=viewAdminPlayers();else if(sub==='settings')body=viewAdminSettings();return`<div class="admin-tab-bar"><button data-action="admin-tab" data-sub="photos" class="${sub==='photos'?'active':''}">📸 Фото</button><button data-action="admin-tab" data-sub="reports" class="${sub==='reports'?'active':''}">💬 Обращения</button><button data-action="admin-tab" data-sub="players" class="${sub==='players'?'active':''}">👥 Игроки</button><button data-action="admin-tab" data-sub="settings" class="${sub==='settings'?'active':''}">⚙️ Настройки</button></div>${body}`}

function viewAdminPhotos(){const srv=serverLoad();const list=srv.pendingEvents.slice().sort((a,b)=>{if(a.status!==b.status)return a.status==='pending'?-1:1;return b.date-a.date});if(list.length===0)return`<div class="card admin-card"><div class="empty"><span class="e-ic">📸</span>Пока нет фотоотчётов</div></div>`;let html=`<div class="card admin-card"><div class="card-title"><span class="dot"></span>Фотоотчёты игроков</div></div>`;list.forEach(pe=>{const stChip=pe.status==='pending'?`<span class="chip pending">⏳ НА ПРОВЕРКЕ</span>`:pe.status==='approved'?`<span class="chip approved">✓ ОДОБРЕНО</span>`:`<span class="chip rejected">✕ ОТКЛОНЕНО</span>`;let actions='';if(pe.status==='pending'){actions=`<button class="btn success" style="width:auto;padding:9px 14px;font-size:12.5px;margin:0;flex:1" data-action="approve-photo" data-id="${pe.id}">✓ Одобрить</button><button class="btn danger" style="width:auto;padding:9px 14px;font-size:12.5px;margin:0;flex:1" data-action="reject-photo" data-id="${pe.id}">✕ Отклонить</button>`}else if(pe.status==='approved'){actions=`<div style="font-size:12px;color:var(--ok);font-weight:700">✓ Начислено ${fmt(pe.eventPoints)}</div>`}else{actions=`<div style="font-size:12px;color:var(--danger);font-weight:700">Причина: ${escapeHtml(pe.adminNote||'—')}</div>`}html+=`<div class="report-card"><div class="report-head"><div><div class="report-from">👤 ${escapeHtml(pe.playerName)}</div><div style="font-size:12px;color:var(--muted);margin-top:3px">${escapeHtml(pe.eventTitle)} • +${fmt(pe.eventPoints)}</div></div><div style="text-align:right">${stChip}<div class="report-date" style="margin-top:4px">${new Date(pe.date).toLocaleString('ru-RU')}</div></div></div><img class="report-img" src="${pe.image}"><div class="report-actions">${actions}</div></div>`});return html}

function viewAdminReports(){const srv=serverLoad();const list=srv.reports.slice().sort((a,b)=>{if((a.adminReply?1:0)!==(b.adminReply?1:0))return a.adminReply?1:-1;return b.date-a.date});if(list.length===0)return`<div class="card admin-card"><div class="empty"><span class="e-ic">💬</span>Обращений пока нет</div></div>`;let html=`<div class="card admin-card"><div class="card-title"><span class="dot"></span>Обращения игроков</div></div>`;list.forEach(r=>{const unread=!r.adminRead;html+=`<div class="report-card" style="${unread?'border-color:rgba(156,39,176,.5);background:rgba(156,39,176,.06)':''}"><div class="report-head"><div><div class="report-from">👤 ${escapeHtml(r.from)}</div>${unread?'<div style="font-size:11px;color:#c48ddb;font-weight:800;letter-spacing:1px;margin-top:3px">● НОВОЕ</div>':''}</div><div class="report-date">${new Date(r.date).toLocaleString('ru-RU')}</div></div><div class="report-text">${escapeHtml(r.message)}</div>${r.image?`<img class="report-img" src="${r.image}">`:''}${r.adminReply?`<div style="background:rgba(56,211,159,.08);border:1px solid rgba(56,211,159,.3);border-radius:10px;padding:12px;margin-top:10px"><div style="font-size:11px;color:var(--ok);font-weight:800;letter-spacing:1px;margin-bottom:6px">✓ ОТВЕТ ОТПРАВЛЕН</div><div style="font-size:13.5px;line-height:1.55;white-space:pre-wrap">${escapeHtml(r.adminReply)}</div></div>`:`<textarea class="field" id="reply-${r.id}" placeholder="Ответ игроку…" style="margin-top:10px"></textarea><div class="report-actions" style="margin-top:10px"><button class="btn" style="width:auto;padding:9px 14px;font-size:12.5px;margin:0;flex:1" data-action="reply-report" data-id="${r.id}">Ответить</button><button class="btn danger" style="width:auto;padding:9px 14px;font-size:12.5px;margin:0;flex:1" data-action="ban-from-report" data-id="${r.id}">🚫 Забанить</button></div>`}</div>`});return html}

function viewAdminPlayers(){const srv=serverLoad();const players=Object.values(srv.players).sort((a,b)=>b.points-a.points);if(players.length===0)return`<div class="card admin-card"><div class="empty"><span class="e-ic">👥</span>Пока нет игроков</div></div>`;const banned=players.filter(p=>p.banned).length;let html=`<div class="card admin-card"><div class="card-title"><span class="dot"></span>Игроки (${players.length})</div><div style="font-size:12.5px;color:var(--muted)">🚫 Забанено: <b style="color:var(--danger)">${banned}</b></div></div>`;players.forEach(p=>{const r=rankOf(p.points);const initials=p.name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();html+=`<div class="player-row ${p.banned?'banned':''}"><div class="p-av">${p.banned?'🚫':initials}</div><div class="p-info"><div class="p-name">${escapeHtml(p.name)} ${p.banned?'<span class="chip banned" style="margin-left:4px">ЗАБАНЕН</span>':''}</div><div class="p-meta">${r.name} • ивентов: ${p.events||0}</div>${p.banned&&p.banReason?`<div class="p-meta" style="color:var(--danger);margin-top:2px">Причина: ${escapeHtml(p.banReason)}</div>`:''}</div><div class="p-pts">${fmt(p.points)}</div><div class="p-actions">${p.banned?`<button class="btn success" style="width:auto;padding:9px 14px;font-size:12.5px;margin:0;flex:1" data-action="unban-player" data-name="${escapeHtml(p.name)}">✓ Разбанить</button>`:`<button class="btn danger" style="width:auto;padding:9px 14px;font-size:12.5px;margin:0;flex:1" data-action="ban-player" data-name="${escapeHtml(p.name)}">🚫 Забанить</button>`}</div></div>`});return html}

function viewAdminSettings(){const srv=serverLoad();return`<div class="card admin-card"><div class="card-title"><span class="dot"></span>Смена пароля</div><div style="font-size:12.5px;color:var(--muted);margin-bottom:12px">Текущий: <b style="color:var(--accent2)">${srv.adminPass}</b></div><input class="field" type="text" id="newAdminPass" placeholder="Новый пароль (мин. 4 символа)"><button class="btn" data-action="change-pass">Сохранить</button></div><div class="card admin-card"><div class="card-title"><span class="dot"></span>Экспорт</div><button class="btn ghost" data-action="export-data">📥 Скачать JSON</button></div><div class="card admin-card"><div class="card-title"><span class="dot"></span>Опасная зона</div><button class="btn danger" data-action="reset-server">🗑️ Сбросить всё</button></div><div class="card admin-card"><div class="card-title"><span class="dot"></span>Выход</div><button class="btn ghost" data-action="logout-admin">🚪 Выйти из админки</button></div>`}

let currentGameId=null,gameCleanup=null;
const GAMES=[
{id:'smelt',icon:'🔥',name:'Плавка стали',desc:'Останови стрелку в зелёной зоне'},
{id:'sort',icon:'📦',name:'Сортировка металла',desc:'Определи группу металла на время'},
{id:'memory',icon:'🧠',name:'Память сталевара',desc:'Повтори последовательность'},
{id:'forge',icon:'🔨',name:'Кузнец',desc:'Успей нанести максимум ударов'},
{id:'screws',icon:'🔧',name:'Винтики и дощечки',desc:'500 уровней с логикой и замками'},
{id:'mahjong',icon:'🀄',name:'Маджонг',desc:'500 уровней: слои, закрытые плитки, таймер'}];

function registerGamePlayed(score){S.gamesPlayed=(S.gamesPlayed||0)+1;const t1=taskById('game');if(t1&&!t1.done)completeTask('game');const t3=taskById('game3');if(t3){t3.prog=Math.min(t3.goal,(t3.prog||0)+1);if(t3.prog>=t3.goal&&!t3.done)completeTask('game3');else save()}if(score>0){if(!S.daily)S.daily=makeDaily();const used=S.daily.gamePointsToday||0,left=DAILY_GAME_CAP-used;if(left<=0){toast('Лимит очков от игр исчерпан','');return}const give=Math.min(left,score);S.daily.gamePointsToday=used+give;addPoints(give,'Мини-игра')}}

function registerPuzzlePlayed(score){S.gamesPlayed=(S.gamesPlayed||0)+1;const t1=taskById('game');if(t1&&!t1.done)completeTask('game');const t3=taskById('game3');if(t3){t3.prog=Math.min(t3.goal,(t3.prog||0)+1);if(t3.prog>=t3.goal&&!t3.done)completeTask('game3');else save()}if(score>0){if(!S.daily)S.daily=makeDaily();const used=S.daily.puzzlePointsToday||0,left=DAILY_PUZZLE_CAP-used;if(left<=0){toast('Лимит очков от головоломок исчерпан','');return}const give=Math.min(left,score);S.daily.puzzlePointsToday=used+give;addPoints(give,'Головоломка')}}

function setupSmelt(){const btn=document.getElementById('gBtn'),needle=document.getElementById('gNeedle'),zoneEl=document.getElementById('gZone');const resEl=document.getElementById('gResult'),roundEl=document.getElementById('gRound'),hitsEl=document.getElementById('gHits');let state='idle',round=1,hits=0,pos=0,dir=1,speed=1.15,last=0,zoneStart=40,zoneW=18,raf=null,done=false;function setZone(){zoneW=Math.max(9,20-(round-1)*4);zoneStart=12+Math.random()*(76-zoneW);zoneEl.style.left=zoneStart+'%';zoneEl.style.width=zoneW+'%'}function tick(t){if(!last)last=t;const dt=Math.min(48,t-last);last=t;pos+=dir*speed*dt*.055;if(pos>=100){pos=100;dir=-1}if(pos<=0){pos=0;dir=1}needle.style.left=pos+'%';raf=requestAnimationFrame(tick)}function start(){btn.onclick=stop;btn.textContent='СТОП!';resEl.textContent='Лови…';resEl.style.color='';last=0;state='run';raf=requestAnimationFrame(tick)}function stop(){if(state!=='run')return;cancelAnimationFrame(raf);raf=null;state='idle';last=0;const inZone=pos>=zoneStart&&pos<=zoneStart+zoneW;if(inZone)hits++;hitsEl.textContent=hits;resEl.textContent=inZone?'✅ Норма!':'❌ Мимо';resEl.style.color=inZone?'var(--ok)':'var(--hot)';if(round>=3){finish();return}round++;roundEl.textContent=round+'/3';speed+=.42;setZone();btn.textContent='Дальше';btn.onclick=start}function finish(){if(done)return;done=true;const reward=hits*5;resEl.innerHTML=hits===3?`🏆 Идеально! +${reward}`:`Попаданий: ${hits}/3 • +${reward}`;resEl.style.color='var(--accent2)';btn.textContent='Снова';btn.onclick=()=>render();registerGamePlayed(reward)}function reset(){cancelAnimationFrame(raf);raf=null;state='idle';round=1;hits=0;pos=0;dir=1;speed=1.15;last=0;done=false;roundEl.textContent='1/3';hitsEl.textContent='0';needle.style.left='0%';setZone();resEl.textContent='Нажми «Старт»';resEl.style.color='';btn.textContent='Старт';btn.onclick=start}reset();gameCleanup=()=>{cancelAnimationFrame(raf);raf=null}}

function setupSort(){const qEl=document.getElementById('sortQuestion'),optsEl=document.getElementById('sortOptions'),timerEl=document.getElementById('sortTimer');const progEl=document.getElementById('sortProgress'),scoreEl=document.getElementById('sortScore'),resultEl=document.getElementById('sortResult'),btn=document.getElementById('sortBtn');const CATS=['Чёрный металл','Цветной металл','Драгоценный металл'];const ITEMS=[{name:'Сталь',cat:0},{name:'Чугун',cat:0},{name:'Медь',cat:1},{name:'Алюминий',cat:1},{name:'Латунь',cat:1},{name:'Бронза',cat:1},{name:'Золото',cat:2},{name:'Серебро',cat:2},{name:'Платина',cat:2},{name:'Никель',cat:1},{name:'Титан',cat:1},{name:'Вольфрам',cat:1}];const TOTAL=8;let qIndex=0,score=0,current=null,timerId=null,timeLeft=6,done=false;function nextQuestion(){if(qIndex>=TOTAL){finish();return}qIndex++;progEl.textContent=qIndex+'/'+TOTAL;current=ITEMS[Math.floor(Math.random()*ITEMS.length)];qEl.textContent='К какой группе относится: '+current.name+'?';optsEl.innerHTML=CATS.map((c,i)=>`<button class="opt" data-sort="${i}">${c}</button>`).join('');optsEl.querySelectorAll('[data-sort]').forEach(b=>{b.onclick=()=>answer(Number(b.dataset.sort))});timeLeft=6;timerEl.style.width='100%';resultEl.textContent='';clearInterval(timerId);timerId=setInterval(()=>{timeLeft-=.1;timerEl.style.width=Math.max(0,(timeLeft/6)*100)+'%';if(timeLeft<=0){clearInterval(timerId);answer(-1)}},100)}function answer(i){clearInterval(timerId);optsEl.querySelectorAll('button').forEach(b=>b.disabled=true);if(i===current.cat){score+=30;scoreEl.textContent=score;resultEl.textContent='✅';resultEl.style.color='var(--ok)'}else{resultEl.textContent=i===-1?'⏰':'❌';resultEl.style.color='var(--hot)'}setTimeout(nextQuestion,600)}function finish(){if(done)return;done=true;const reward=Math.floor(score/10);qEl.textContent='Готово!';optsEl.innerHTML='';timerEl.style.width='0%';resultEl.innerHTML=`Итог: <b style="color:var(--accent2)">${reward} очков</b>`;btn.textContent='Снова';btn.disabled=false;btn.onclick=()=>render();registerGamePlayed(reward)}btn.onclick=()=>{qIndex=0;score=0;done=false;scoreEl.textContent='0';btn.disabled=true;nextQuestion()};gameCleanup=()=>{clearInterval(timerId);timerId=null}}

function viewMemory(){return`<button class="back-btn" data-action="back-games">‹ Назад</button><div class="card"><div class="card-title"><span class="dot"></span>Память сталевара</div><div class="game-info" style="margin-bottom:8px"><span>Раунд: <b id="memRound" style="color:var(--accent2)">1/8</b></span><span>Очки: <b id="memScore" style="color:var(--ok)">0</b></span></div><div class="mem-pad"><div class="mem-btn" data-pad="0">🔥</div><div class="mem-btn" data-pad="1">⚙️</div><div class="mem-btn" data-pad="2">🔨</div><div class="mem-btn" data-pad="3">🏭</div></div><div class="game-result" id="memStatus" style="text-align:center;min-height:22px">Нажми «Старт»</div><button class="btn" id="memBtn">Старт</button></div>`}
function setupMemory(){const pads=document.querySelectorAll('.mem-btn'),status=document.getElementById('memStatus'),roundEl=document.getElementById('memRound'),scoreEl=document.getElementById('memScore'),btn=document.getElementById('memBtn');const MAX_ROUNDS=8;let sequence=[],playerIdx=0,round=1,mistakes=0,score=0,playing=false,accepting=false,seqTimer=null,done=false;function nextRound(){sequence.push(Math.floor(Math.random()*4));playerIdx=0;accepting=false;roundEl.textContent=round+'/'+MAX_ROUNDS;status.textContent='Смотри…';status.style.color='';playSequence()}function playSequence(){let i=0;seqTimer=setInterval(()=>{if(i>=sequence.length){clearInterval(seqTimer);seqTimer=null;accepting=true;status.textContent='Твоя очередь!';status.style.color='var(--accent2)';return}const idx=sequence[i],pad=pads[idx];pad.classList.add('flash');setTimeout(()=>pad.classList.remove('flash'),420);i++},650)}pads.forEach((pad,i)=>{pad.addEventListener('click',()=>{if(!accepting||!playing)return;pad.classList.add('flash');setTimeout(()=>pad.classList.remove('flash'),200);if(sequence[playerIdx]===i){playerIdx++;if(playerIdx===sequence.length){accepting=false;score+=30;scoreEl.textContent=score;if(round>=MAX_ROUNDS){finish('🏆 Победа!');return}round++;setTimeout(nextRound,900)}}else{mistakes++;status.textContent=`Ошибка! Осталось: ${2-mistakes}`;status.style.color='var(--hot)';accepting=false;if(mistakes>=2){finish('Игра окончена');return}setTimeout(()=>{playerIdx=0;accepting=true;status.textContent='Попробуй снова';status.style.color='var(--accent2)'},900)}})});function finish(msg){if(done)return;done=true;playing=false;accepting=false;clearInterval(seqTimer);seqTimer=null;const reward=Math.floor(score/10);status.innerHTML=`${msg}<br>Итог: <b style="color:var(--accent2)">${reward} очков</b>`;status.style.color='';btn.textContent='Снова';btn.disabled=false;btn.onclick=()=>render();registerGamePlayed(reward)}btn.onclick=()=>{sequence=[];round=1;mistakes=0;score=0;done=false;scoreEl.textContent='0';playing=true;btn.disabled=true;status.textContent='Приготовься…';setTimeout(nextRound,700)};gameCleanup=()=>{clearInterval(seqTimer);seqTimer=null}}
